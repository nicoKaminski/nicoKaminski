name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Set night rainbow background
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("profile-3d-contrib/profile-night-rainbow.svg")
          content = path.read_bytes()
          replacements = (
              (b".fill-bg { fill: #00000f; }", b".fill-bg { fill: #0D1117; }"),
              (b".stroke-bg { stroke: #00000f; }", b".stroke-bg { stroke: #0D1117; }"),
          )

          for original, replacement in replacements:
              if content.count(original) != 1:
                  raise SystemExit(f"Expected exactly one {original.decode()}, found {content.count(original)}")
              content = content.replace(original, replacement, 1)

          path.write_bytes(content)
          PY
      - name: Replace language pie with GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 .github/scripts/replace-pie-with-stats.py
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "generated"
          git push
